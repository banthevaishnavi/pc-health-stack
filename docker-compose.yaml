version: '3.8'

services:
  # The "Collector" - Grabs your PC stats
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=/etc/otelcol-config.yaml"]
    volumes:
      - ./otel-config.yaml:/etc/otelcol-config.yaml
      # Essential for Linux to see host metrics. For Windows, use Docker Desktop's default mounts.
      - /proc:/hostfs/proc:ro
      - /sys:/hostfs/sys:ro
      - /:/rootfs:ro
    ports:
      - "8889:8889"   # Prometheus exporter port

  # The "Storage" - Saves the stats
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus-config.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  # The "Visualizer" - Draws the graphs
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus